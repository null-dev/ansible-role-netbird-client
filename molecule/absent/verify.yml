---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check for netbird process (should fail)
      ansible.builtin.shell: pgrep -f netbird
      register: pgrep_result
      until: pgrep_result.rc != 0
      retries: 15
      delay: 1
      changed_when: false
      ignore_errors: true

    - name: Debug processes if verification failed
      ansible.builtin.command: ps -aux
      register: ps_output
      when: pgrep_result.rc == 0
      changed_when: false
      ignore_errors: true

    - name: Print process list if verification failed
      ansible.builtin.debug:
        var: ps_output.stdout_lines
      when: pgrep_result.rc == 0

    - name: Fail if netbird process is still running
      ansible.builtin.fail:
        msg: "Netbird process is still running after 15 seconds."
      when: pgrep_result.rc == 0
