---
- name: Get latest Netbird version from GitHub
  ansible.builtin.uri:
    url: "https://api.github.com/repos/netbirdio/netbird/releases/latest"
    return_content: true
  register: netbird_latest_release
  when: netbird_state == 'latest'

- name: Set netbird_version fact (latest)
  ansible.builtin.set_fact:
    netbird_version: "{{ netbird_latest_release.json.tag_name | regex_replace('^v', '') }}"
  when: netbird_state == 'latest'

- name: Check if Netbird binary exists
  ansible.builtin.stat:
    path: "{{ netbird_binary_install_dir }}/netbird"
  register: netbird_binary_stat
  become: true

- name: Check installed Netbird version
  ansible.builtin.command: "{{ netbird_binary_install_dir }}/netbird version"
  register: netbird_installed_version_output
  changed_when: false
  ignore_errors: true
  when: netbird_binary_stat.stat.exists
  become: true

- name: Determine if Netbird needs update
  ansible.builtin.set_fact:
    netbird_needs_update: >-
      {{
        not netbird_binary_stat.stat.exists or
        (netbird_installed_version_output.stdout | default('') != netbird_version)
      }}

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/netbird-install
    state: directory
    mode: "0755"
  when: netbird_needs_update
  become: true

- name: Download and unarchive Netbird
  ansible.builtin.unarchive:
    src: "https://github.com/netbirdio/netbird/releases/download/v{{ netbird_version }}/netbird_{{ netbird_version }}_linux_{{ netbird_arch }}.tar.gz"
    dest: /tmp/netbird-install
    remote_src: true
  when: netbird_needs_update
  become: true

- name: Install Netbird binary
  ansible.builtin.copy:
    src: /tmp/netbird-install/netbird
    dest: "{{ netbird_binary_install_dir }}/netbird"
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  notify: restart netbird
  when: netbird_needs_update
  become: true

- name: Install Netbird service
  ansible.builtin.command:
    cmd: "{{ netbird_binary_install_dir }}/netbird service install"
    creates: "/etc/systemd/system/{{ netbird_service_name }}.service"
  when: netbird_needs_update
  become: true

- name: Cleanup temporary directory
  ansible.builtin.file:
    path: /tmp/netbird-install
    state: absent
  when: netbird_needs_update
  become: true
