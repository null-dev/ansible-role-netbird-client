---
- name: Add Netbird repository
  ansible.builtin.yum_repository:
    name: netbird
    description: Netbird
    baseurl: https://pkgs.netbird.io/yum/
    enabled: true
    gpgcheck: false
    repo_gpgcheck: true
    gpgkey: https://pkgs.netbird.io/yum/repodata/repomd.xml.key
  become: true

- name: Install Netbird
  ansible.builtin.yum:
    name: netbird
    state: "{{ netbird_state }}"
    update_cache: "{{ 'yes' if netbird_state == 'latest' else 'no' }}"
  notify: restart netbird
  become: true
