---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - procps
    state: present
    update_cache: true
  become: true

- name: Add Netbird GPG key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /usr/share/keyrings/netbird-archive-keyring.asc
    mode: "0644"
  become: true

- name: Dearmor Netbird GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg /usr/share/keyrings/netbird-archive-keyring.asc
    creates: /usr/share/keyrings/netbird-archive-keyring.gpg
  become: true

- name: Add Netbird repository
  ansible.builtin.deb822_repository:
    name: netbird
    types: deb
    uris: https://pkgs.netbird.io/debian
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/netbird-archive-keyring.gpg
    state: present
    enabled: true
  become: true
  notify: update apt cache

- name: Install Netbird
  ansible.builtin.apt:
    name: netbird
    state: present
  notify: restart netbird
  become: true
